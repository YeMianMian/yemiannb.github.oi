function startGame() {
  document.getElementById('start-screen').classList.remove('active');
  document.getElementById('select-screen').classList.add('active');
}

function selectTrainer(t) {
  trainer = t;
  document.getElementById('select-screen').classList.remove('active');
  document.getElementById('game-screen').classList.add('active');
  remaining = 5;
  dayAllComfort = true;
  actionLog = [];
  updateUI();
  renderActions();
  addLog(`【DAY ${day}】调教师：${getTrainerName(t)} 已就位。格赫罗斯被带到调教室……`);
}

function getTrainerName(t) {
  return {hudson:'哈德森', jacob:'雅各布', raven:'渡鸦', prometheus:'罗米修斯'}[t];
}

function renderActions() {
  const area = document.getElementById('action-area');
  area.innerHTML = '';
  const list = actions[trainer];
  list.forEach((a, idx) => {
    const btn = document.createElement('button');
    btn.className = 'btn action-btn';
    btn.textContent = a.name;
    btn.onclick = () => doAction(idx);
    if (remaining <= 0) btn.disabled = true;
    area.appendChild(btn);
  });
}

function getIncrease(baseMin, baseMax) {
  // Progressive: day 1 base, later days higher
  const bonus = Math.floor((day - 1) * 1.8);
  const min = baseMin + bonus;
  const max = baseMax + bonus + Math.floor(day / 2);
  return Math.floor(Math.random() * (max - min + 1)) + min;
}

function checkThresholds(part) {
  const val = sens[part];
  const m = milestones[part];
  
  if (val >= 50 && !m[50]) {
    m[50] = true;
    triggerThreshold(part, 50);
  } else if (val >= 80 && !m[80]) {
    m[80] = true;
    triggerThreshold(part, 80);
  } else if (val >= 100 && !m[100]) {
    m[100] = true;
    triggerThreshold(part, 100);
  } else if (val >= 150 && !m[150]) {
    m[150] = true;
    triggerThreshold(part, 150);
  } else if (val >= 200 && !m[200]) {
    m[200] = true;
    triggerThreshold(part, 200);
  }
}

function triggerThreshold(part, level) {
  const flash = document.getElementById('flash');
  const modal = document.getElementById('threshold-modal');
  const content = document.getElementById('threshold-content');
  const title = document.getElementById('th-title');
  const msg = document.getElementById('th-msg');
  
  let flashClass = '';
  let bg = '';
  let color = '';
  let message = '';
  
  if (level === 50) {
    flashClass = 'flash-red';
    bg = '#000'; color = '#f00';
    message = `格赫罗斯的${partName[part]}已经变得更淫乱了！深深地堕落下去吧…`;
  } else if (level === 80) {
    flashClass = 'flash-pink';
    bg = '#ff69b4'; color = '#f00';
    message = `格赫罗斯的${partName[part]}已经变得非常淫乱了~请继续使用`;
  } else if (level === 100) {
    flashClass = 'flash-deep';
    bg = '#f00'; color = '#000';
    message = `格赫罗斯已经是你最骚的婊子了…请尽情享用！`;
  } else if (level === 150) {
    flashClass = 'flash-pink';
    bg = '#111'; color = '#ff69b4';
    message = `${partName[part]}变得熟透了，离不开主人了…`;
  } else if (level === 200) {
    flashClass = 'flash-deep';
    bg = '#200'; color = '#f00';
    message = `${partName[part]}已经不能再继续了，快要坏掉了…`;
  }
  
  // Flash
  flash.className = 'flash ' + flashClass;
  setTimeout(() => { flash.className = 'flash'; }, 700);
  
  // Modal
  content.style.background = bg;
  content.style.color = color;
  content.style.border = `3px solid ${color === '#000' ? '#f00' : color}`;
  title.textContent = level >= 150 ? '极限预警' : '敏感度突破';
  msg.textContent = message;
  modal.classList.add('show');
}

  area.innerHTML = '';
  cultivateActions.forEach((a, idx) => {
    const btn = document.createElement('button');
    btn.className = 'btn action-btn';
    btn.style.background = '#ff69b4';
    btn.style.color = '#fff';
    btn.textContent = a.name;
    btn.onclick = () => doCultivateAction(idx);
    if (remaining <= 0) btn.disabled = true;
    area.appendChild(btn);
  });
}

function doCultivateAction(idx) {
  if (remaining <= 0) return;
  const act = cultivateActions[idx];
  
  let affChange = 0, depChange = 0, shameChange = 0;
  
  if (act.id === 'flirt') {
    affChange = -(Math.floor(Math.random()*6) + 10); // -10~-15
    shameChange = -(Math.floor(Math.random()*6) + 10); // -10~-15
    depChange = Math.floor(Math.random()*14) + 5; // +5~18
  } else if (act.id === 'comfort2') {
    depChange = Math.floor(Math.random()*11) + 10; // +10~20
    affChange = Math.floor(Math.random()*6) + 5; // +5~10
    shameChange = -(Math.floor(Math.random()*11) + 10); // -10~-20
  } else if (act.id === 'feed') {
    depChange = Math.floor(Math.random()*5) + 8; // +8~12
    affChange = Math.floor(Math.random()*7) + 12; // +12~18
    shameChange = -(Math.floor(Math.random()*11) + 10); // -10~-20
  } else if (act.id === 'company') {
    depChange = Math.floor(Math.random()*6) + 15; // +15~20
    affChange = Math.floor(Math.random()*7) + 10; // +10~16
    shameChange = -(Math.floor(Math.random()*11) + 10); // -10~-20
  }
  
  affection = Math.max(0, Math.min(200, affection + affChange));
  dependence = Math.max(0, Math.min(200, dependence + depChange));
  shame = Math.max(0, Math.min(100, shame + shameChange));
  
  // 文本
  const pool = cultivateTexts[act.id];
  const text = pool[Math.floor(Math.random() * pool.length)];
  
  let logMsg = `【${act.name}】`;
  logMsg += `（好感 ${affChange>=0?'+':''}${affChange}　依赖 ${depChange>=0?'+':''}${depChange}　羞耻 ${shameChange>=0?'+':''}${shameChange}）`;
  logMsg += `<br>${text}`;
  addLog(logMsg);
  
  actionLog.push({name: act.name, affChange, depChange, shameChange});
  
  remaining--;
  updateUI();
  renderCultivateActions();
  
  // 检查好感150邀请
  if (affection >= 150 && !inviteTriggered) {
    inviteTriggered = true;
    setTimeout(() => {
      document.getElementById('invite-modal').classList.add('show');
    }, 500);
    return;
  }
  
  // 检查好感200结局
  if (affection >= 200) {
    setTimeout(() => endCultivateByAffection(), 700);
    return;
  }
  
  if (remaining <= 0) {
    setTimeout(showCultivateSummary, 600);
  }
}

function handleInvite(yes) {
  document.getElementById('invite-modal').classList.remove('show');
  if (yes) {
    affection = Math.max(0, Math.min(200, affection - 20));
    dependence = Math.max(0, Math.min(200, dependence - 10));
    shame = Math.min(100, shame + 30);
    addLog(`<span class="highlight">【回应】</span>你选择了“是”。格赫罗斯的脸瞬间爆红，身体微微发抖……好感下降，羞耻大幅上升，依赖也受到了一点影响。`);
    updateUI();
    
    // 如果因为这次降到了200以下，继续；如果还是高，再检查
    if (affection >= 200) {
      setTimeout(() => endCultivateByAffection(), 800);
    }
  } else {
    addLog(`<span class="highlight">【回应】</span>你选择了“否”。格赫罗斯有些失落地点了点头，把到嘴边的话咽了回去，游戏继续。`);
  }
}

function showCultivateSummary() {
  // 简单总结，然后进入下一天或结局
  setTimeout(() => {
    document.getElementById('sum-day').textContent = day;
    let html = `<p>今日行动：5次</p><ul style="margin:10px 0 15px 20px;">`;
    actionLog.forEach(a => {
      html += `<li>${a.name}（好感${a.affChange>=0?'+':''}${a.affChange} 依赖${a.depChange>=0?'+':''}${a.depChange} 羞耻${a.shameChange>=0?'+':''}${a.shameChange}）</li>`;
    });
    html += `</ul>`;
    html += `<p>当前：好感 <span style="color:#ff69b4;">${affection}</span>　依赖 <span style="color:#da70d6;">${dependence}</span>　羞耻 <span style="color:#ff69b4;">${shame}</span></p>`;
    
    if (day < 10) {
      html += `<p style="margin-top:15px;color:#c71585;">培养还在继续……明天会更好吗？</p>`;
    } else {
      html += `<p style="margin-top:15px;color:#c71585;">十天的培养已经结束。</p>`;
    }
    
    document.getElementById('sum-text').innerHTML = html;
    // 修改总结按钮行为
    const sumBtn = document.querySelector('#summary-content .continue-btn');
    if (sumBtn) {
      sumBtn.onclick = nextCultivateDay;
      sumBtn.textContent = day < 10 ? '进入下一天' : '查看结局';
    }
    document.getElementById('summary-modal').classList.add('show');
  }, 400);
}

function nextCultivateDay() {
  document.getElementById('summary-modal').classList.remove('show');
  
  if (day >= 10) {
    endCultivateByDays();
    return;
  }
  
  day++;
  remaining = 5;
  actionLog = [];
  document.getElementById('log').innerHTML = '';
  updateUI();
  renderCultivateActions();
  addLog(`【培养 DAY ${day}】新的一天。格赫罗斯看到你，主动靠近了一点……`);
}

function endCultivateByAffection() {
  // 好感达到200时的即时结局
  let title = '', desc = '', tagText = '', key = '';
  
  if (dependence > 100 && shame < 50) {
    title = '完美恋人';
    desc = '好感、依赖都拉满，羞耻也降到了最低。格赫罗斯已经完全打开了心扉，愿意把一切都给你。你们成为了真正意义上的完美恋人。';
    tagText = '完美恋人结局';
    key = 'perfect_lover';
  } else if (dependence > 100 && shame > 50) {
    title = '羞涩的恋人';
    desc = '他很爱你，也很依赖你，却依然保留着那份容易脸红的羞耻。每一次亲密都会让他害羞得不行，却又舍不得离开。';
    tagText = '羞涩的恋人结局';
    key = 'shy_lover';
  } else if (dependence < 100 && shame < 50) {
    title = '不愿依赖的恋人';
    desc = '好感已经很高，羞耻也低了，可他始终不太愿意把重量都压在你身上。他爱你，却更想保持一点独立。';
    tagText = '不愿依赖的恋人结局';
    key = 'independent_lover';
  } else {
    // 其他组合归为浪荡的恋人
    title = '浪荡的恋人';
    desc = '好感拉满后，他变得大胆而主动。依赖不那么极端，羞耻也没有完全消失，却已经会用身体和眼神主动讨好你。';
    tagText = '浪荡的恋人结局';
    key = 'slutty_lover';
  }
  
  unlockEnding(key);
  showCultivateEnding(title, desc, tagText);
}

function endCultivateByDays() {
  // 10天结束后的结局
  let title = '', desc = '', tagText = '', key = '';
  
  if (affection < 200) {
    if (dependence < 200 && shame > 50) {
      title = '普通驯化结局';
      desc = '十天过去了，好感没能突破200。他被你驯化得有些听话，却还保留着明显的羞耻和距离。算是普通的驯化成果。';
      tagText = '普通驯化结局';
      key = 'normal_train';
    } else if (dependence >= 200 && shame < 50) {
      title = '好用的炮友';
      desc = '依赖拉得极高，羞耻几乎消失，好感却没到恋人的程度。他已经习惯被你使用，也享受被你使用，成为了一个好用的炮友。';
      tagText = '好用的炮友结局';
      key = 'fuckbuddy';
    } else {
      title = '普通驯化结局';
      desc = '十天的培养告一段落。关系有了进展，却还没到质变的地步。或许还需要更多时间。';
      tagText = '普通驯化结局';
      key = 'normal_train';
    }
  } else {
    // 理论上好感200会提前结束，这里兜底
    endCultivateByAffection();
    return;
  }
  
  unlockEnding(key);
  showCultivateEnding(title, desc, tagText);
}

function showCultivateEnding(title, desc, tagText) {
  document.getElementById('game-screen').classList.remove('active');
  document.getElementById('summary-modal').classList.remove('show');
  document.getElementById('invite-modal').classList.remove('show');
  document.getElementById('ending-screen').classList.add('active');
  
  const t = document.getElementById('end-title');
  const d = document.getElementById('end-desc');
  const tag = document.getElementById('end-tag');
  
  t.style.color = '#ff1493';
  t.textContent = title;
  d.textContent = desc;
  tag.className = 'ending-tag good';
  tag.textContent = tagText;
  
  // 只保留重新开始
  document.getElementById('end-buttons').innerHTML = `<button class="btn" onclick="location.reload()">重新开始</button>`;
}

// 覆盖原来的 updateUI，让它兼容培养模式
const originalUpdateUI = updateUI;
updateUI = function() {
  if (isCultivate) {
    const affEl = document.getElementById('s-affection');
    const depEl = document.getElementById('s-dependence');
    const shameEl = document.getElementById('s-shame');
    if (affEl) affEl.textContent = affection;
    if (depEl) depEl.textContent = dependence;
    if (shameEl) shameEl.textContent = shame;
    document.getElementById('day-display').textContent = `DAY ${day}`;
    document.getElementById('rem-count').textContent = remaining;
  } else {
    originalUpdateUI();
  }
};
</script>
